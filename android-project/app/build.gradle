plugins {
     id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def buildWithCMake = true;

android {
    buildFeatures {
        buildConfig true
    }
    namespace = "pl.cntrpl.voidsprite"
    compileSdkVersion 36
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        buildConfigField "boolean", "FDROID_BUILD", "false"
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-21"
            }
            cmake {
                arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static"
            }
        }
    }
    signingConfigs {
        release {
            def tmpFilePath = System.getProperty("user.home") + "/work/_temp/keystore/"
            def allFilesFromDir = new File(tmpFilePath).listFiles()

            if (allFilesFromDir != null) {
                def keystoreFile = allFilesFromDir.first()
                keystoreFile.renameTo("keystore/vsp_keystore.jks")
            }

            storeFile = file("keystore/vsp_keystore.jks")
            storePassword System.getenv("SIGNING_STORE_PASSWORD")
            keyAlias System.getenv("SIGNING_KEY_ALIAS")
            keyPassword System.getenv("SIGNING_KEY_PASSWORD")
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "◆debug"
            signingConfig signingConfigs.debug
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        release {
            minifyEnabled false
            signingConfig file("keystore/vsp_keystore.jks").exists() ? signingConfigs.release
                    : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            }
            externalNativeBuild {
                cmake {
                    arguments "-DRELEASE=ON"
                }
            }
        }
        debugOneArch {
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "◆debug"
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            def buildArch = System.getenv("VSP_BUILD_ARCH")
            ndk {
                abiFilters new String[]{buildArch != null ? buildArch : "arm64-v8a"}
            }
        }
        releaseOneArch {
            minifyEnabled false
            signingConfig file("keystore/vsp_keystore.jks").exists() ? signingConfigs.release
                    : signingConfigs.debug

            def buildArch = System.getenv("VSP_BUILD_ARCH")
            ndk {
                abiFilters new String[]{buildArch != null ? buildArch : "arm64-v8a"}
            }
            externalNativeBuild {
                cmake {
                    arguments "-DRELEASE=ON"
                }
            }
        }
    }

    flavorDimensions "deploymentType"
    productFlavors {
        standalone {
            getIsDefault().set(true)
            dimension "deploymentType"
        }
        fdroid {
            dimension "deploymentType"

            buildConfigField "boolean", "FDROID_BUILD", "true"
            externalNativeBuild {
                cmake {
                    arguments "-DFDROID=ON"
                }
            }
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            if (buildWithCMake) {
                cmake {
                    path 'jni/CMakeLists.txt'
                }
            } else {
                ndkBuild {
                    path 'jni/Android.mk'
                }
            }
        }

    }
    lint {
        abortOnError = false
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    ndkVersion '29.0.14206865'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'com.jaredrummler:android-device-names:2.1.1'
}
